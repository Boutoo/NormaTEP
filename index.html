<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stats Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <style>
        body { padding: 20px; }
        /* Prevent long text from breaking layout */
        table.dataTable td { white-space: nowrap; } 
    </style>
</head>
<body>

    <div class="container-fluid">
        <h1>Feature Statistics</h1>
        <div id="table-container">
            <div class="text-center mt-5">Loading data...</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        // REPLACE THIS WITH YOUR CSV FILE PATH
        const csvFilePath = './norm.csv'; 

        Papa.parse(csvFilePath, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // Generate table headers dynamically based on CSV keys
                let columns = [];
                let headers = Object.keys(results.data[0]);
                
                headers.forEach(header => {
                    columns.push({ title: header, data: header });
                });

                // Initialize DataTable
                $('#table-container').html('<table id="statsTable" class="table table-striped table-bordered" style="width:100%"></table>');
                
                $('#statsTable').DataTable({
                    data: results.data,
                    columns: columns,
                    scrollX: true, // Enable horizontal scrolling for many columns
                    pageLength: 25, // Default rows per page
                    order: [[0, 'asc']] // Default sort by first column
                });
            }
        });
    </script>
</body>
</html>
